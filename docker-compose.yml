# ============================================================
# PlayLedger 개발용 Docker Compose
# 현재는 DB(PostgreSQL)만. 추후 Redis 추가 예정
# ============================================================

services:
  # ── PostgreSQL ── 데이터를 보관하는 창고
  db:
    # 창고 설계도 ─ 버전 18 "메이저 버전 고정"
    # latest로 두면 나중에 19 버전이 나왔을 때 다른 PC에 다른 창고가 지어진다.
    image: postgres:18
    container_name: playledger-db

    # 창고를 처음 지을 때 사용할 계정. 값은 옆에 있는 .env에서 채워진다.
    # ${...}는 빈칸. compose가 .env를 읽어와 채워넣는다.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # "내 PC 포트 : conteiner 포트" 연결
    # 내 PC는 5434 (확인 결과 5432 = 윈도우 설치 PostgreSQL, 5433 = 콕 컨테이너가 사용 중)
    # 컨테이너는 그대로 5432 (컨테이너 입장에선 자기 집 현관 번호라 똑같음)
    # 127.0.0.1을 붙이면 내 PC 안에서만 접속 가능 (같은 WiFi의 다른 기기는 접속 불가)
    ports:
      - "127.0.0.1:5434:5432"

    # 창고 물건을 container 밖 전용 보관함(pgdata)에 둔다
    # container를 지웠다 다시 만들어도 데이터가 남는 이유
    volumes:
      - pgdata:/var/lib/postgresql

    # 창고 문이 열려있는지 n초 마다 knock 해본다.
    # server container가 DB가 준비된 뒤에 시작하려면 필요하다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

# 보관함에 이름을 붙여준다 ─ 실제 위치는 Docker가 관리 (Project 폴더 밖)
volumes:
  pgdata:
