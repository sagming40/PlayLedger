<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 장부 본체. rx는 모서리 둥글기 -->
  <rect x="5" y="3" width="22" height="26" rx="3" fill="#18181b"/>
  <!-- 왼쪽 세로 여백선. 공책의 빨간 세로줄 같은 역할 -->
  <rect x="9" y="3" width="1.5" height="26" fill="#71717a"/>
  <!-- 기록된 줄 3개. 길이를 다르게 해서 '적다 만 장부'처럼 보이게 -->
  <rect x="13" y="9"  width="10" height="2" rx="1" fill="#fafafa"/>
  <rect x="13" y="15" width="7"  height="2" rx="1" fill="#fafafa"/>
  <rect x="13" y="21" width="9"  height="2" rx="1" fill="#a1a1aa"/>
</svg>