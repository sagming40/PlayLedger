# 운영 구성 (PLAN M5). 서버의 /srv/playledger/compose.yaml로 복사해 쓴다. 값은 같은 폴더의 .env(권한 600)
# 내 PC에서 확인할 때는 deploy/compose.local.yaml을 덧붙여 이미지를 직접 빌드한다
name: playledger

# Docker 기본값은 로그를 끝없이 쌓는다 ─ 10MB 3개로 돌려 쓴다
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 정문 ─ 인터넷에 열린 것은 이것뿐이다
  web:
    image: ghcr.io/sagming40/playledger-web:${IMAGE_TAG:?배포할 커밋이 없다}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?.env에 SITE_ADDRESS가 없다}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    volumes:
      - caddy_data:/data        # 인증서 ─ 지우면 다시 받아야 하고, 자주 받으면 Let's Encrypt가 막는다
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: 172.30.0.10   # API가 믿는 프록시 주소. server/Dockerfile과 같아야 한다
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  api:
    image: ghcr.io/sagming40/playledger-api:${IMAGE_TAG:?배포할 커밋이 없다}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?.env에 JWT_SECRET_KEY가 없다}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      ENABLE_DOCS: "false"
      # Steam · Discord에서 돌아올 주소의 앞부분. 비밀값이 아니어서 .env 대신 여기 둔다 (server/app/core/config.py)
      PUBLIC_BASE_URL: https://play.sagming.com
    # 포트를 밖으로 열지 않는다 ─ Caddy를 거치지 않으면 닿을 수 없다
    networks:
      - edge        # Caddy와 만나고 Steam으로 나간다
      - backend     # DB와 만난다
    depends_on:
      db:
        condition: service_healthy
    # 앱이 털려도 파일을 고치거나 권한을 얻지 못하게 한다
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?.env에 POSTGRES_USER가 없다}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD가 없다}
      POSTGRES_DB: ${POSTGRES_DB:?.env에 POSTGRES_DB가 없다}
    # ports를 쓰지 않는다 ─ Docker는 ufw를 우회해 포트를 열기 때문에 애초에 열지 않는다
    # 볼륨 위치: Postgres 18부터 /var/lib/postgresql 자체를 묶는다
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
    internal: true   # 인터넷으로 나가는 길이 없다 ─ DB가 밖으로 데이터를 보낼 수 없다

volumes:
  caddy_data:
  caddy_config:
  pgdata:
