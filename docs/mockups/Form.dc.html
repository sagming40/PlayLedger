<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>S-03 게임 등록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.9}
input::placeholder,textarea::placeholder{color:#6E6E7A}
</style>
</helmet>
<div style="min-height: 1180px; display: flex; flex-wrap: wrap; background: {{t.bg}}; color: {{t.text}}; font-family: 'Inter','Noto Sans KR',sans-serif">
<div aria-hidden="true" style="inset: 0; background: {{t.fade}}"></div><aside style="flex: 1 1 220px; box-sizing: border-box; padding: 28px 16px; border-right: 1px solid {{t.border}}; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 10px">
<span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.accent}}; display: inline-block"></span>
<span style="font-size: 17px; font-weight: 800; letter-spacing: 0.04em">PLAYLEDGER</span>
</div>
<nav aria-label="주 메뉴" style="display: flex; flex-direction: column; gap: 4px">
<a href="Library.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 8px; font-size: 15px; font-weight: 600; background: {{t.accentTint}}; color: {{t.accentText}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
라이브러리</a>
<a href="Stats.dc.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 8px; font-size: 15px; color: {{t.muted}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20H2"></path></svg>
통계</a>
<a href="Settings.dc.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 8px; font-size: 15px; color: {{t.muted}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10"></path><path d="M18 6h2"></path><circle cx="16" cy="6" r="2"></circle><path d="M4 12h4"></path><path d="M12 12h8"></path><circle cx="10" cy="12" r="2"></circle><path d="M4 18h12"></path><circle cx="18" cy="18" r="2"></circle></svg>
설정</a>
</nav>
</aside>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 24px 40px 56px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 760px">
<a href="Library.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; font-size: 14px; color: {{t.muted}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
라이브러리</a>
</div>
<h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.03em">게임 등록</h1>
<form style="max-width: 760px; display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="title" style="font-size: 14px; font-weight: 600">제목 <span style="color: {{t.accentText}}">*</span></label>
<input id="title" type="text" placeholder="예: 발더스 게이트 3" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: 400 16px 'Inter','Noto Sans KR',sans-serif">
</div>
<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 10px; font-size: 14px; font-weight: 600">상태 <span style="color: {{t.accentText}}">*</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{statuses}}" as="s" hint-placeholder-count="5">
<button type="button" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="height: 44px; padding: 0 16px; border-radius: 10px; font: {{s.font}}; background: {{s.bg}}; color: {{s.color}}; border: 1px solid {{s.line}}; display: inline-flex; align-items: center; gap: 8px; cursor: pointer"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{s.dot}}; display: inline-block"></span>{{s.label}}</button>
</sc-for>
</div>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 10px; font-size: 14px; font-weight: 600">장르 <span style="font-weight: 400; color: {{t.muted}}">· 여러 개 선택</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{genres}}" as="g" hint-placeholder-count="8">
<button type="button" aria-pressed="{{g.pressed}}" onClick="{{g.pick}}" style="height: 40px; padding: 0 14px; border-radius: 999px; font: {{g.font}}; background: {{g.bg}}; color: {{g.color}}; border: 1px solid {{g.line}}; cursor: pointer">{{g.label}}</button>
</sc-for>
</div>
</fieldset>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
<label for="bought" style="font-size: 14px; font-weight: 600">구매일</label>
<input id="bought" type="date" value="2026-01-15" style="height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: 400 15px 'Inter','Noto Sans KR',sans-serif; color-scheme: {{t.scheme}}">
</div>
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
<label for="price" style="font-size: 14px; font-weight: 600">구매가 <span style="font-weight: 400; color: {{t.muted}}">(원)</span></label>
<input id="price" type="text" inputmode="numeric" placeholder="66,000" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: 400 15px 'Inter','Noto Sans KR',sans-serif">
</div>
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
<label for="hours" style="font-size: 14px; font-weight: 600">플레이타임 <span style="font-weight: 400; color: {{t.muted}}">(시간)</span></label>
<input id="hours" type="text" inputmode="decimal" placeholder="0" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: 400 15px 'Inter','Noto Sans KR',sans-serif">
</div>
</div>
<sc-if value="{{showRating}}" hint-placeholder-val="{{false}}">
<section style="padding: 20px 22px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.border}}; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span id="ratingLabel" style="font-size: 14px; font-weight: 600">평점</span>
<div role="group" aria-labelledby="ratingLabel" style="display: flex; gap: 2px">
<sc-for list="{{stars}}" as="st" hint-placeholder-count="5">
<button type="button" aria-label="{{st.aria}}" onClick="{{st.pick}}" style="width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="28" height="28" viewBox="0 0 24 24" fill="{{st.fill}}" stroke="{{st.stroke}}" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"></path></svg>
</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="review" style="font-size: 14px; font-weight: 600">한줄평</label>
<textarea id="review" rows="2" placeholder="예: 엔딩 보고 한참 멍했음" style="box-sizing: border-box; padding: 12px 14px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.text}}; font: 400 15px 'Inter','Noto Sans KR',sans-serif; resize: vertical"></textarea>
<span style="align-self: flex-end; font-size: 12px; color: {{t.muted}}">0 / 200</span>
</div>
</section>
</sc-if>
<sc-if value="{{hideRating}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; font-size: 13px; color: {{t.muted}}">평점 · 한줄평은 클리어 또는 포기했을 때 적을 수 있어요</p>
</sc-if>
<div style="display: flex; justify-content: flex-end; gap: 10px; padding-top: 8px; border-top: 1px solid {{t.border}}">
<a href="Library.dc.html" style="height: 46px; padding: 0 18px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: 500 15px 'Inter','Noto Sans KR',sans-serif; display: inline-flex; align-items: center; box-sizing: border-box">취소</a>
<button type="button" style="height: 46px; padding: 0 22px; border-radius: 10px; border: none; background: {{t.accent}}; color: #FFFFFF; font: 700 15px 'Inter','Noto Sans KR',sans-serif">저장</button>
</div>
</form>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"테마"},"statusScheme":{"editor":"enum","options":["현행안","교체안"],"default":"현행안","section":"테마"},"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { status: 'BACKLOG', genres: ['RPG'], rating: 0 };
  }
  renderVals() {
    const mode = (this.props.dark ?? true) ? 'dark' : 'light';
    const THEMES = {
      dark: { bg: '#0E0E11', surface: '#17171C', border: '#2C2C35', text: '#F2F2F5', muted: '#A1A1AC', scheme: 'dark' },
      light: { bg: '#F6F6F8', surface: '#FFFFFF', border: '#E2E2E8', text: '#17171B', muted: '#5C5C68', scheme: 'light' }
    };
    const STATUS = {
      현행안: { BACKLOG: ['#9A9AA6', '#7A7A86'], PLAYING: ['#3B82F6', '#2563EB'], CLEARED: ['#22C55E', '#16A34A'], ON_HOLD: ['#EAB308', '#CA8A04'], DROPPED: ['#5E5E68', '#B4B4BE'] },
      교체안: { BACKLOG: ['#9A9AA6', '#7A7A86'], PLAYING: ['#22C55E', '#16A34A'], CLEARED: ['#3B82F6', '#2563EB'], ON_HOLD: ['#EAB308', '#CA8A04'], DROPPED: ['#EF4444', '#DC2626'] }
    };
    const LABEL = { BACKLOG: '미시작', PLAYING: '플레이중', CLEARED: '클리어', ON_HOLD: '보류', DROPPED: '포기' };
    const tint = (hex, a) => {
      const n = parseInt(hex.slice(1), 16);
      return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    const accent = '#D12E34';
    const t = {
      ...THEMES[mode],
      accent,
      accentText: mode === 'dark' ? '#FF7276' : '#B4232A',
      accentTint: tint(accent, mode === 'dark' ? 0.14 : 0.08),
      accentLine: tint(accent, mode === 'dark' ? 0.55 : 0.4)
    };
    const sc = STATUS[this.props.statusScheme ?? '현행안'] || STATUS['현행안'];
    const pickStyle = (on, radiusFont) => ({
      pressed: on ? 'true' : 'false',
      bg: on ? t.accentTint : t.surface,
      color: on ? t.text : t.muted,
      line: on ? t.accentLine : t.border,
      font: (on ? '600' : '500') + ' ' + radiusFont + " 'Inter','Noto Sans KR',sans-serif"
    });
    const statuses = Object.keys(LABEL).map((k) => ({
      label: LABEL[k],
      dot: sc[k][mode === 'dark' ? 0 : 1],
      pick: () => this.setState({ status: k }),
      ...pickStyle(this.state.status === k, '14px')
    }));
    const GENRES = ['액션', '어드벤처', 'RPG', '전략', '시뮬레이션', '캐주얼', '레이싱', '스포츠'];
    const genres = GENRES.map((g) => {
      const on = this.state.genres.includes(g);
      return {
        label: g,
        pick: () => this.setState({ genres: on ? this.state.genres.filter((x) => x !== g) : this.state.genres.concat(g) }),
        ...pickStyle(on, '14px'),
        color: on ? t.accentText : t.muted
      };
    });
    const rated = this.state.status === 'CLEARED' || this.state.status === 'DROPPED';
    const stars = [1, 2, 3, 4, 5].map((n) => ({
      aria: n + '점',
      fill: n <= this.state.rating ? t.accentText : 'none',
      stroke: n <= this.state.rating ? t.accentText : t.muted,
      pick: () => this.setState({ rating: n })
    }));
    return { t, statuses, genres, stars, showRating: rated, hideRating: !rated };
  }
}
</script>
</body>
</html>
