<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>S-02 빈 상태</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.9}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-wrap: wrap; background: {{t.bg}}; color: {{t.text}}; font-family: 'Inter','Noto Sans KR',sans-serif">
<aside style="flex: 1 1 220px; box-sizing: border-box; padding: 28px 16px; border-right: 1px solid {{t.border}}; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 10px">
<span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.accent}}; display: inline-block"></span>
<span style="font-size: 17px; font-weight: 800; letter-spacing: 0.04em">PLAYLEDGER</span>
</div>
<nav aria-label="주 메뉴" style="display: flex; flex-direction: column; gap: 4px">
<a href="Library.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 8px; font-size: 15px; font-weight: 600; background: {{t.accentTint}}; color: {{t.accentText}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
라이브러리</a>
<a href="Stats.dc.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 8px; font-size: 15px; color: {{t.muted}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20H2"></path></svg>
통계</a>
<a href="Settings.dc.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 8px; font-size: 15px; color: {{t.muted}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10"></path><path d="M18 6h2"></path><circle cx="16" cy="6" r="2"></circle><path d="M4 12h4"></path><path d="M12 12h8"></path><circle cx="10" cy="12" r="2"></circle><path d="M4 18h12"></path><circle cx="18" cy="18" r="2"></circle></svg>
설정</a>
</nav>
</aside>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 0 40px 56px; display: flex; flex-direction: column; gap: 20px">
<section style="position: relative; margin: 0 -40px; height: 280px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end">
<div aria-hidden="true" style="position: absolute; top: -24px; left: 0; right: 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; padding: 0 8px">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="24">
<div style="aspect-ratio: 2 / 3; border-radius: 6px; border: 1px dashed {{t.slotLine}}; box-sizing: border-box"></div>
</sc-for>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: {{t.wallFade}}"></div>
<div style="position: relative; padding: 0 40px 8px">
<h1 style="margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -0.03em">라이브러리</h1>
</div>
</section>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 72px 20px; text-align: center">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6.5" width="19" height="12" rx="4"></rect><path d="M7 11v3"></path><path d="M5.5 12.5h3"></path><circle cx="16" cy="11.5" r="0.9" fill="{{t.muted}}"></circle><circle cx="18" cy="13.5" r="0.9" fill="{{t.muted}}"></circle></svg>
<h2 style="margin: 0; font-size: 22px; font-weight: 700">아직 등록된 게임이 없어요</h2>
<p style="margin: 0; font-size: 15px; color: {{t.muted}}">산 게임을 하나 등록하면 방치일수부터 세기 시작해요</p>
<a href="Form.dc.html" style="margin-top: 8px; height: 48px; padding: 0 22px; border-radius: 10px; background: {{t.accent}}; color: #FFFFFF; font: 700 15px 'Inter','Noto Sans KR',sans-serif; display: inline-flex; align-items: center; gap: 6px; box-sizing: border-box">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
게임 추가하기</a>
</div>
<div style="max-width: 720px; width: 100%; align-self: center; padding: 18px 20px; border-radius: 12px; border: 1px solid {{t.border}}; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; color: {{t.muted}}">필터 결과가 0개일 때</span>
<span style="font-size: 15px">해당 상태의 게임이 없습니다</span>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"테마"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = (this.props.dark ?? true) ? 'dark' : 'light';
    const THEMES = {
      dark: { bg: '#0E0E11', surface: '#17171C', border: '#2C2C35', text: '#F2F2F5', muted: '#A1A1AC', slotLine: '#34343E' },
      light: { bg: '#F6F6F8', surface: '#FFFFFF', border: '#E2E2E8', text: '#17171B', muted: '#5C5C68', slotLine: '#CFCFD8' }
    };
    const tint = (hex, a) => {
      const n = parseInt(hex.slice(1), 16);
      return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    const accent = '#D12E34';
    const bg = THEMES[mode].bg;
    const t = {
      ...THEMES[mode],
      accent,
      accentText: mode === 'dark' ? '#FF7276' : '#B4232A',
      accentTint: tint(accent, mode === 'dark' ? 0.14 : 0.08),
      wallFade: 'linear-gradient(180deg, ' + tint(bg, 0.2) + ' 0%, ' + tint(bg, 0.7) + ' 55%, ' + bg + ' 100%)'
    };
    return { t, slots: Array.from({ length: 24 }, (_, i) => i) };
  }
}
</script>
</body>
</html>
