<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>상단 메뉴 시안</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.9}
</style>
</helmet>
<div style="position: relative; min-height: 900px; background: {{t.bg}}; color: {{t.text}}; font-family: 'Inter','Noto Sans KR',sans-serif">

<nav aria-label="주 메뉴" style="{{nav.barStyle}}">
<div style="max-width: 1280px; height: 100%; margin: 0 auto; box-sizing: border-box; padding: 0 40px; display: flex; align-items: center">
<div style="{{nav.rowStyle}}">
<a href="#" aria-label="PlayLedger 홈" style="display: flex; align-items: center; gap: 10px; flex-shrink: 0">
<span style="width: 32px; height: 32px; border-radius: 9px; background: {{t.accent}}; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="{{t.onAccent}}" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"></path></svg>
</span>
<span style="font-size: 16px; font-weight: 800; letter-spacing: 0.04em">PLAYLEDGER</span>
</a>
<div style="{{nav.groupStyle}}">
<sc-for list="{{nav.items}}" as="m" hint-placeholder-count="3">
<a href="#" aria-current="{{m.current}}" style="{{m.style}}">
<sc-if value="{{m.iconLibrary}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg></sc-if>
<sc-if value="{{m.iconStats}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20H2"></path></svg></sc-if>
<sc-if value="{{m.iconSettings}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10"></path><path d="M18 6h2"></path><circle cx="16" cy="6" r="2"></circle><path d="M4 12h4"></path><path d="M12 12h8"></path><circle cx="10" cy="12" r="2"></circle><path d="M4 18h12"></path><path d="M20 18h0"></path><circle cx="18" cy="18" r="2"></circle></svg></sc-if>
{{m.label}}</a>
</sc-for>
</div>
<sc-if value="{{nav.gear}}" hint-placeholder-val="{{true}}">
<a href="#" aria-label="설정" title="설정" style="{{nav.gearStyle}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10"></path><path d="M18 6h2"></path><circle cx="16" cy="6" r="2"></circle><path d="M4 12h4"></path><path d="M12 12h8"></path><circle cx="10" cy="12" r="2"></circle><path d="M4 18h12"></path><path d="M20 18h0"></path><circle cx="18" cy="18" r="2"></circle></svg>
</a>
</sc-if>
<sc-if value="{{nav.cta}}" hint-placeholder-val="{{false}}">
<button type="button" style="margin-left: auto; height: 40px; padding: 0 16px; border-radius: 10px; border: none; background: {{t.accent}}; color: {{t.onAccent}}; font: 600 14px 'Inter','Noto Sans KR',sans-serif; display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
게임 등록</button>
</sc-if>
</div>
</div>
</nav>

<sc-if value="{{isLibrary}}" hint-placeholder-val="{{true}}">
<section style="position: relative; height: {{heroHeight}}; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end">
<div aria-hidden="true" style="position: absolute; top: -24px; left: 0; right: 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; padding: 0 8px; opacity: {{t.wallOpacity}}">
<sc-for list="{{wall}}" as="w" hint-placeholder-count="24">
<div style="aspect-ratio: 2 / 3; border-radius: 6px; background: {{w.cover}}; display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box"><span style="font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.55); line-height: 1.15">{{w.title}}</span></div>
</sc-for>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: {{wallFade}}"></div>
<div style="position: relative; width: 100%; max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 0 40px 8px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -0.03em">라이브러리</h1>
<p style="margin: 0; font-size: 15px; color: {{t.muted}}">총 <strong style="color: {{t.text}}">42</strong>개 · 미시작 <strong style="color: {{t.accentText}}">18</strong>개 · 가장 오래 방치 <strong style="color: {{t.accentText}}">214일</strong></p>
</div>
<sc-if value="{{heroCta}}" hint-placeholder-val="{{true}}">
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 10px; border: none; background: {{t.accent}}; color: {{t.onAccent}}; font: 600 15px 'Inter','Noto Sans KR',sans-serif; display: inline-flex; align-items: center; gap: 6px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
게임 등록</button>
</sc-if>
</div>
</section>
<main style="max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 20px 40px 56px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div role="group" aria-label="상태 필터" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button type="button" aria-pressed="{{c.pressed}}" style="height: 36px; padding: 0 14px; border-radius: 999px; font: {{c.font}}; background: {{c.bg}}; color: {{c.color}}; border: 1px solid {{c.line}}; display: inline-flex; align-items: center; gap: 7px">
<sc-if value="{{c.hasDot}}" hint-placeholder-val="{{true}}"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{c.dot}}; display: inline-block"></span></sc-if>{{c.label}}</button>
</sc-for>
</div>
<label style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: {{t.muted}}">정렬
<select style="height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: 500 14px 'Inter','Noto Sans KR',sans-serif">
<option>최근 수정순</option>
</select>
</label>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 22px 20px">
<sc-for list="{{games}}" as="g" hint-placeholder-count="10">
<a href="#" style="display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; background: {{t.surface}}; border: 1px solid {{t.border}}">
<div style="aspect-ratio: 460 / 215; background: {{g.cover}}; display: flex; align-items: flex-end; padding: 12px 14px; box-sizing: border-box">
<span style="font-size: 19px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.01em; line-height: 1.15">{{g.title}}</span>
</div>
<div style="padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.title}}</span>
<span style="font-size: 13px; display: flex; align-items: center; gap: 6px; color: {{t.muted}}"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{g.dot}}; display: inline-block; flex-shrink: 0"></span><span style="color: {{t.text}}">{{g.label}}</span> · <span style="color: {{g.metricColor}}; font-weight: {{g.metricWeight}}">{{g.metric}}</span></span>
<span style="font-size: 12px; color: {{t.muted}}">{{g.genres}}</span>
</div>
</a>
</sc-for>
</div>
</main>
</sc-if>

<sc-if value="{{isPlain}}" hint-placeholder-val="{{false}}">
<main style="max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 24px 40px 56px; display: flex; flex-direction: column; gap: 24px">
<h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.03em">통계</h1>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<div style="padding: 20px; border-radius: 12px; background: {{t.surface}}; border: 1px solid {{t.border}}; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: {{t.muted}}">{{s.label}}</span>
<strong style="font-size: 30px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{s.value}}</strong>
</div>
</sc-for>
</div>
<div style="height: 340px; border-radius: 12px; background: {{t.surface}}; border: 1px solid {{t.border}}; display: flex; align-items: center; justify-content: center; font-size: 14px; color: {{t.muted}}">그래프 자리 (Stats 목업 참고)</div>
</main>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["A","B","C","D","E","F","G","H"],"default":"H","section":"시안"},"screen":{"editor":"enum","options":["library","plain"],"default":"library","section":"시안"},"dark":{"editor":"boolean","default":true,"section":"테마"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = (this.props.dark ?? true) ? 'dark' : 'light';
    const variant = String(this.props.variant ?? 'H').charAt(0).toUpperCase();
    const isLibrary = (this.props.screen ?? 'library') !== 'plain';
    const THEMES = {
      dark: { bg: '#0E0E11', surface: '#17171C', surface2: '#22222A', border: '#2C2C35', text: '#F2F2F5', muted: '#A1A1AC' },
      light: { bg: '#F6F6F8', surface: '#FFFFFF', surface2: '#EEEEF2', border: '#E2E2E8', text: '#17171B', muted: '#5C5C68' }
    };
    const DOT = { BACKLOG: ['#9A9AA6', '#7A7A86'], PLAYING: ['#3B82F6', '#2563EB'], CLEARED: ['#22C55E', '#16A34A'], ON_HOLD: ['#EAB308', '#CA8A04'], DROPPED: ['#5E5E68', '#B4B4BE'] };
    const LABEL = { BACKLOG: '미시작', PLAYING: '플레이중', CLEARED: '클리어', ON_HOLD: '보류', DROPPED: '포기' };
    const tint = (hex, a) => {
      const n = parseInt(hex.slice(1), 16);
      return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    const dotOf = (s) => DOT[s][mode === 'dark' ? 0 : 1];
    const bg = THEMES[mode].bg;
    const t = {
      ...THEMES[mode],
      accent: '#D12E34',
      onAccent: '#FFFFFF',
      accentText: mode === 'dark' ? '#FF7276' : '#B4232A',
      accentTint: tint('#D12E34', mode === 'dark' ? 0.14 : 0.08),
      accentLine: tint('#D12E34', mode === 'dark' ? 0.55 : 0.4),
      wallOpacity: mode === 'dark' ? '0.9' : '0.55'
    };

    // A · C · F는 벽 위에 메뉴를 띄운다 ─ 벽이 없는 화면에서는 그냥 맨 위에 놓인다
    const overlay = 'ACF'.includes(variant) && isLibrary;
    // D ~ G는 B에서 출발한 시안이라 활성 칩의 빨강을 빼서 메뉴와 겹치지 않게 한다
    const quietChip = 'DEFGH'.includes(variant);
    const barBase = 'height: ' + (variant === 'F' ? 84 : 72) + 'px; box-sizing: border-box; ';
    const ROW = 'flex: 1; min-width: 0; align-self: stretch; position: relative; display: flex; align-items: center; gap: 24px';
    const bar = overlay ? 'position: absolute; top: 0; left: 0; right: 0; z-index: 2; ' : 'position: relative; ';
    const LINK = "display: inline-flex; align-items: center; text-decoration: none; white-space: nowrap; ";
    const gearStyle = 'margin-left: auto; width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: ' + t.muted + '; ' +
      (variant === 'A' ? 'background: ' + tint(t.surface, 0.72) + '; border: 1px solid ' + t.border + '; backdrop-filter: blur(12px); box-sizing: border-box;' : '');

    const NAVS = {
      // A ─ 유리 알약 + 무채색 채움. 빨강은 "게임 등록"과 숫자에만 남긴다
      A: {
        barStyle: barBase + bar,
        groupStyle: 'display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: ' + tint(t.surface, 0.72) + '; border: 1px solid ' + t.border + '; backdrop-filter: blur(12px)',
        labels: ['라이브러리', '통계'],
        gear: true,
        item: (on) => LINK + 'height: 36px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: ' + (on ? 700 : 500) + '; ' +
          (on ? 'background: ' + t.text + '; color: ' + t.bg : 'color: ' + t.muted)
      },
      // B ─ material-dict 그대로. 벽 위쪽의 불투명 띠 + 포인트 색 채움
      B: {
        barStyle: barBase + bar + 'background: ' + t.bg + '; border-bottom: 1px solid ' + t.border,
        groupStyle: 'display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: ' + t.surface + '; border: 1px solid ' + t.border,
        labels: ['라이브러리', '통계', '설정'],
        gear: false,
        item: (on) => LINK + 'height: 36px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: ' + (on ? 700 : 500) + '; ' +
          (on ? 'background: ' + t.accent + '; color: ' + t.onAccent : 'color: ' + t.muted)
      },
      // C ─ 알약 없이 글자 탭 + 밑줄. 아래 상태 칩과 모양이 겹치지 않는다
      C: {
        barStyle: barBase + bar,
        groupStyle: 'display: flex; align-self: stretch; gap: 24px; margin-left: 12px',
        labels: ['라이브러리', '통계'],
        gear: true,
        item: (on) => LINK + 'box-sizing: border-box; padding-top: 2px; border-bottom: 2px solid ' + (on ? t.accent : 'transparent') + '; font-size: 15px; font-weight: ' + (on ? 700 : 500) + '; ' +
          'color: ' + (on ? t.text : t.muted)
      }
    };
    // D ~ G가 공유하는 B의 알약 ─ 메뉴 3개, 활성은 포인트 색 채움
    const PILL = {
      barStyle: barBase + bar + 'background: ' + t.bg + '; border-bottom: 1px solid ' + t.border,
      groupStyle: NAVS.B.groupStyle,
      labels: NAVS.B.labels,
      gear: false,
      item: NAVS.B.item
    };
    // D ─ B에서 활성 칩만 무채색으로
    NAVS.D = PILL;
    // E ─ D + 게임 등록을 메뉴 띠로 옮겨 어느 화면에서든 누를 수 있게
    NAVS.E = { ...PILL, cta: true };
    // F ─ 띠를 없애고 벽 위에 둥근 캡슐로 띄운다. 등록 버튼도 캡슐 안에
    NAVS.F = {
      ...PILL,
      barStyle: barBase + bar,
      cta: true,
      rowStyle: 'flex: 1; min-width: 0; height: 60px; box-sizing: border-box; padding: 0 10px 0 14px; position: relative; display: flex; align-items: center; gap: 24px; border-radius: 18px; background: ' + tint(t.surface, 0.8) + '; border: 1px solid ' + t.border + '; backdrop-filter: blur(14px); box-shadow: 0 10px 28px rgba(0,0,0,' + (mode === 'dark' ? 0.35 : 0.1) + ')'
    };
    // G ─ D + 아이콘이 붙은 알약을 띠 가운데에
    NAVS.G = {
      ...PILL,
      groupStyle: NAVS.B.groupStyle + '; position: absolute; left: 50%; transform: translateX(-50%)',
      icons: true,
      item: (on) => NAVS.B.item(on) + '; gap: 7px'
    };
    // H ─ 채택안. E의 띠와 등록 버튼 + G의 아이콘 (decisions/0010)
    NAVS.H = { ...NAVS.E, icons: true, item: NAVS.G.item };
    const raw = NAVS[variant] || NAVS.A;
    const active = isLibrary ? '라이브러리' : '통계';
    const nav = {
      barStyle: raw.barStyle,
      rowStyle: raw.rowStyle || ROW,
      groupStyle: raw.groupStyle,
      gear: raw.gear,
      gearStyle,
      cta: !!raw.cta,
      items: raw.labels.map((label) => ({
        label,
        style: raw.item(label === active),
        current: label === active ? 'page' : 'false',
        iconLibrary: !!raw.icons && label === '라이브러리',
        iconStats: !!raw.icons && label === '통계',
        iconSettings: !!raw.icons && label === '설정'
      }))
    };

    // 메뉴가 벽 위에 얹히면 글자가 읽히도록 맨 위를 한 번 더 어둡게(라이트는 밝게) 덮는다
    const wallFade = overlay
      ? 'linear-gradient(180deg, ' + tint(bg, 0.82) + ' 0%, ' + tint(bg, 0.5) + ' 26%, ' + tint(bg, 0.8) + ' 62%, ' + bg + ' 100%)'
      : 'linear-gradient(180deg, ' + tint(bg, 0.35) + ' 0%, ' + tint(bg, 0.8) + ' 55%, ' + bg + ' 100%)';

    const chips = [{ key: null, label: '전체' }].concat(['BACKLOG', 'PLAYING', 'CLEARED', 'ON_HOLD', 'DROPPED'].map((s) => ({ key: s, label: LABEL[s] })))
      .map((c, i) => {
        const on = i === 0;
        return {
          label: c.label,
          pressed: on ? 'true' : 'false',
          hasDot: c.key !== null,
          dot: c.key ? dotOf(c.key) : t.muted,
          bg: on ? (quietChip ? t.surface2 : t.accentTint) : 'transparent',
          color: on ? (quietChip ? t.text : t.accentText) : t.muted,
          line: on ? (quietChip ? t.muted : t.accentLine) : t.border,
          font: (on ? '600' : '500') + " 14px 'Inter','Noto Sans KR',sans-serif"
        };
      });
    const RAW = [
      { title: '발더스 게이트 3', status: 'BACKLOG', idle: 214, genres: 'RPG', cover: '#2B2140' },
      { title: 'Hollow Knight', status: 'PLAYING', hours: '12.5', genres: '액션 · 어드벤처', cover: '#1D2E45' },
      { title: '사이버펑크 2077', status: 'CLEARED', hours: '62.4', genres: 'RPG · 액션', cover: '#3D2A10' },
      { title: '엘든 링', status: 'BACKLOG', idle: 180, genres: '액션 · RPG', cover: '#33301C' },
      { title: '스타듀 밸리', status: 'PLAYING', hours: '40.5', genres: '시뮬레이션 · RPG', cover: '#1F3A2C' },
      { title: '데스 스트랜딩', status: 'BACKLOG', idle: 156, genres: '액션 · 어드벤처', cover: '#1C2A33' },
      { title: '문명 VI', status: 'ON_HOLD', hours: '8.0', genres: '전략', cover: '#23382B' },
      { title: 'Two Point Hospital', status: 'BACKLOG', idle: 92, genres: '시뮬레이션', cover: '#1E3440' },
      { title: 'Forza Horizon 5', status: 'DROPPED', hours: '1.2', genres: '레이싱', cover: '#3A1E24' },
      { title: 'Disco Elysium', status: 'BACKLOG', idle: 41, genres: 'RPG', cover: '#2E2638' }
    ];
    const games = RAW.map((g) => {
      const backlog = g.status === 'BACKLOG';
      const loud = backlog && g.idle >= 180;
      return {
        title: g.title,
        genres: g.genres,
        cover: g.cover,
        label: LABEL[g.status],
        dot: dotOf(g.status),
        metric: backlog ? '방치 ' + g.idle + '일' : g.hours + '시간',
        metricColor: loud ? t.accentText : t.muted,
        metricWeight: loud ? '700' : '400'
      };
    });
    const wall = Array.from({ length: 24 }, (_, i) => RAW[(i * 3) % RAW.length]);
    const stats = [
      { label: '총 구매액', value: '1,284,000원' },
      { label: '미시작', value: '18개' },
      { label: '완주율', value: '31%' },
      { label: '시간당 비용', value: '2,140원' }
    ];
    return { t, nav, wallFade, heroCta: !nav.cta, heroHeight: overlay ? '340px' : '280px', isLibrary, isPlain: !isLibrary, chips, games, wall, stats };
  }
}
</script>
</body>
</html>
