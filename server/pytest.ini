[pytest]
# tests/ 안에서 "import app.main"이 되도록, server/ 경로를 module 검색 경로에 넣는다
# server/ 경로를 적용해두지 않으면 pytest는 tests/ 폴더만 경로에 적용되어 app을 찾지 못한다
pythonpath = .
testpaths = tests

# 모든 async 테스트에 매번 @pytest.mark.asyncio를 붙이지 않아도 되도록
asyncio_mode = auto

# fixture와 test를 동일한 event loop에서 돌린다
# 그렇지 않으면 session 단위로 만든 DB Engine과 test가 서로 다른 loop에 앉아서
# "attached to a different loop" error가 난다 ─ pytest-asyncio의 최대 지뢰
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
